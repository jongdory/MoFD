lightning:
  trainer:
    max_epochs: 500
    check_val_every_n_epoch: 10
    batch_frequency: 1000
    increase_log_steps: false
model:
  base_learning_rate: 1e-5
  target: mofd.models.unet.UNet
  params:
    # ckpt_path: to be filled
    source: ["t1", "t2", "flair"]
    target: "t1ce"

    backbone_config:
      target: mofd.models.architectures.unet.MOFDUNet
      params:
        input_channels: 1
        num_classes: 1
        backbone_class_name: PlainConvUNet
        n_stages: 5
        features_per_stage: [32, 64, 128, 256, 512]
        kernel_sizes: [3, 3, 3, 3, 3]
        strides: [1, 2, 2, 2, 2]
        n_conv_per_stage: [2, 2, 2, 2, 2]
        n_conv_per_stage_decoder: [2, 2, 2, 2]
        
    lossconfig:
      target: mofd.modules.losses.perceptual.LPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 1
        disc_start: 0
        disc_weight: 0.08
        align_weight: 0.1

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 12
    train:
      target: mofd.data.brain.Brain3DTrain
      params:
        phase: train
    validation:
      target: mofd.data.brain.Brain3DTest
      params:
        phase: val
    test:
      target: mofd.data.brain.Brain3DTest
      params:
        phase: test
